<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
<rect width="860" height="540" fill="#ffffff"/>
<text x="40" y="32" font-size="15" font-weight="bold" fill="#222">Cardputer ADV - EXT 2.54-14P</text>
<text x="40" y="50" fill="#666">viewed from the back, label upright</text>
<rect x="40" y="112" width="380" height="110" rx="6" fill="#f2f2f2" stroke="#999"/>
<circle cx="70" cy="145" r="12" fill="#fff" stroke="#555"/>
